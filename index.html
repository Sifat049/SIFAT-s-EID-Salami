<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sifat's Eid Salami 🌙</title>
<meta name="description" content="Spin the wheel and win your Eid Salami from Sifat!">
<meta name="theme-color" content="#071a2b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#ffd166; --pink:#ff4fa3; --cyan:#35e0ff; --green:#2ee59d;
  --bg1:#0b2a3f; --bg2:#050b14;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;
  color:#fff;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 16px 60px;
  background:
    radial-gradient(ellipse at 50% -10%,#16507a 0%,transparent 55%),
    radial-gradient(ellipse at 90% 100%,#3a1457 0%,transparent 50%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  overflow-x:hidden;
}

/* twinkling stars */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}

/* crescent moon */
.moon{
  position:fixed;top:22px;right:26px;width:74px;height:74px;border-radius:50%;
  box-shadow:inset -22px 6px 0 0 var(--gold);
  filter:drop-shadow(0 0 18px rgba(255,209,102,.6));
  transform:rotate(-18deg);z-index:0;
}

/* hanging lanterns */
.lantern{position:fixed;top:0;z-index:0;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:sway 4s ease-in-out infinite}
.lantern::before{content:"";width:2px;height:var(--len);background:rgba(255,255,255,.35)}
.lantern span{font-size:34px;filter:drop-shadow(0 0 12px rgba(255,190,80,.8))}
.l1{left:6%;--len:50px}
.l2{left:16%;--len:95px;animation-delay:-1.5s}
.l3{right:22%;--len:70px;animation-delay:-2.5s}
@keyframes sway{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}

.container{
  position:relative;z-index:2;
  width:100%;max-width:430px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  padding:30px 22px 28px;border-radius:28px;text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset;
}
.badge{
  display:inline-block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 14px;border-radius:999px;margin-bottom:12px;
  color:var(--gold);background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.3);
}
.title{
  font-size:30px;font-weight:800;line-height:1.15;margin:0 0 8px;
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan),var(--gold));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
}
@keyframes shine{to{background-position:300% 0}}
.caption{font-size:15px;color:#c6d4e3;margin:0 0 26px}

/* wheel */
.wheel-wrap{position:relative;width:min(310px,78vw);margin:0 auto}
.wheel-wrap::before{
  content:"";position:absolute;inset:-12px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--gold),var(--pink),var(--cyan),var(--green),var(--gold));
  filter:blur(14px);opacity:.55;animation:spinglow 8s linear infinite;
}
@keyframes spinglow{to{transform:rotate(360deg)}}
.wheel{
  position:relative;width:100%;display:block;border-radius:50%;
  border:6px solid #fff;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.55);
  transition:transform 5.2s cubic-bezier(.12,.7,.1,1);
}
.pointer{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;
  border-top:34px solid var(--gold);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));
}
.hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;
  width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#ffd166 60%,#e09a1a);
  box-shadow:0 4px 14px rgba(0,0,0,.5);display:grid;place-items:center;font-size:24px;
}

/* buttons */
.btn{
  font-family:inherit;border:0;cursor:pointer;color:#fff;font-weight:700;letter-spacing:.03em;
  border-radius:999px;padding:14px 36px;font-size:16px;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  box-shadow:0 10px 26px rgba(255,79,163,.35),0 0 0 1px rgba(255,255,255,.18) inset;
  transition:transform .15s,box-shadow .15s,opacity .15s;
}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.spin-btn{margin-top:28px;width:100%;max-width:260px;font-size:18px;padding:16px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(255,79,163,.35)}50%{box-shadow:0 10px 38px rgba(53,224,255,.6)}}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset;padding:12px 28px;font-size:14px}

/* modal */
.modal{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(3,8,16,.82);backdrop-filter:blur(6px);
}
.modal.open{display:flex}
.box{
  width:100%;max-width:360px;text-align:center;padding:30px 22px 24px;border-radius:24px;
  background:linear-gradient(170deg,#12304a,#0a1624);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 0 60px rgba(53,224,255,.25);animation:pop .45s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.prize-emoji{font-size:54px;line-height:1}
.prize-label{font-size:13px;color:#9fb4c8;margin:10px 0 2px;letter-spacing:.12em;text-transform:uppercase}
.prize-value{
  font-size:40px;font-weight:800;margin:0 0 14px;
  background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.form{margin-top:6px;text-align:left}
.form label{display:block;font-size:13px;color:#b9c9da;margin:12px 0 6px;font-weight:500}
.form input{
  width:100%;padding:13px 14px;border-radius:12px;font-size:16px;font-family:inherit;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);outline:none;
}
.form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,224,255,.2)}
.form input[readonly]{color:var(--gold);font-weight:700}
.form .btn{width:100%;margin-top:18px}
.hint{font-size:12px;color:#8ea3b8;margin:10px 0 0;text-align:center}
.status{min-height:22px;margin:12px 0 0;font-size:14px;text-align:center;font-weight:600}
.status.err{color:#ff7a90}.status.ok{color:var(--green)}
.close-row{margin-top:14px}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

footer{position:relative;z-index:2;margin-top:34px;font-size:12px;color:#7f93a8;text-align:center}
</style>
</head>

<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="lantern l1"><span>🏮</span></div>
<div class="lantern l2"><span>🏮</span></div>
<div class="lantern l3"><span>🏮</span></div>

<main class="container">
  <div class="badge">Eid Mubarak 🌙</div>
  <h1 class="title">Sifat's Eid Salami</h1>
  <p class="caption">Spin the wheel &amp; see your Eid surprise! 💸🤲</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <svg viewBox="-100 -100 200 200" class="wheel" id="wheel" aria-label="Eid salami prize wheel"></svg>
    <div class="hub">🌙</div>
  </div>

  <button class="btn spin-btn" id="spinBtn" onclick="spin()">SPIN 🔥</button>
</main>

<!-- result modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="prize-emoji" id="prizeEmoji">🎉</div>
    <div class="prize-label">You got</div>
    <div class="prize-value" id="prizeValue"></div>

    <div id="dua" style="display:none">
      <p style="color:#c6d4e3;font-size:14px;margin:0 0 6px">Sifat will make dua for you! Eid Mubarak 🤲✨</p>
    </div>

    <form class="form" id="claimForm" style="display:none" onsubmit="claim(event)">
      <label for="number">Your bKash / Nagad number</label>
      <input id="number" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" maxlength="11" autocomplete="tel">
      <label for="amount">Salami amount</label>
      <input id="amount" readonly>
      <button class="btn" type="submit" id="claimBtn">Claim my salami 💸</button>
      <p class="hint">Sifat gets an instant notification with your number.</p>
    </form>
    <p class="status" id="status"></p>

    <div class="close-row"><button class="btn ghost" onclick="closeModal()">Close</button></div>
  </div>
</div>

<canvas id="confetti"></canvas>

<footer>&copy; 2026 Sifat. All rights reserved.</footer>

<script>
/* ================= SETTINGS (edit here) ================= */
// 1) Install the free "ntfy" app on your phone, then subscribe to this exact topic name.
//    Every salami claim will send a push notification to your phone.
const NTFY_TOPIC = "sifat-salami-8852d848f00c";

// 2) Prizes on the wheel (6 slices). weight = chance (bigger = more likely).
const PRIZES = [
  { label:"Dua 🤲✨", short:"Dua 🤲",  amount:0,    weight:1 },
  { label:"20 tk",    short:"20 tk",   amount:20,   weight:1 },
  { label:"50 tk",    short:"50 tk",   amount:50,   weight:1 },
  { label:"100 tk",   short:"100 tk",  amount:100,  weight:1 },
  { label:"500 tk",   short:"500 tk",  amount:500,  weight:1 },
  { label:"1000 tk",  short:"1000 tk", amount:1000, weight:1 }
];
/* ========================================================= */

const COLORS=[["#ff4fa3","#7a3cff"],["#35e0ff","#1a6bff"],["#2ee59d","#0aa86b"],["#ffd166","#ff7a1a"],["#ff5d73","#a21caf"],["#7be8ff","#3a8dff"]];
const N=PRIZES.length, SLICE=360/N;
let rot=0, spinning=false, current=null, claimed=false;

/* ----- build wheel ----- */
(function buildWheel(){
  const svg=document.getElementById("wheel");
  let defs="",paths="",labels="";
  const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [r*Math.cos(a),r*Math.sin(a)];};
  PRIZES.forEach((p,i)=>{
    const [c1,c2]=COLORS[i%COLORS.length];
    defs+=`<linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
    const [x1,y1]=pt(i*SLICE,100),[x2,y2]=pt((i+1)*SLICE,100);
    paths+=`<path d="M0,0 L${x1},${y1} A100,100 0 0,1 ${x2},${y2} Z" fill="url(#g${i})" stroke="rgba(255,255,255,.55)" stroke-width="1"/>`;
    const mid=i*SLICE+SLICE/2;
    labels+=`<text transform="rotate(${mid}) translate(0,-66)" font-size="12.5" font-weight="800" text-anchor="middle" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px">${p.short}</text>`;
  });
  svg.innerHTML=`<defs>${defs}</defs>${paths}${labels}<circle r="100" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"/>`;
})();

/* ----- stars ----- */
(function stars(){
  const s=document.getElementById("stars");
  for(let i=0;i<60;i++){
    const d=document.createElement("i");
    d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";
    d.style.animationDelay=(Math.random()*3)+"s";d.style.animationDuration=(2+Math.random()*3)+"s";
    s.appendChild(d);
  }
})();

/* ----- spin ----- */
function pickIndex(){
  const total=PRIZES.reduce((a,p)=>a+p.weight,0);
  let r=Math.random()*total;
  for(let i=0;i<N;i++){ if((r-=PRIZES[i].weight)<0) return i; }
  return N-1;
}
function spin(){
  if(spinning) return;
  spinning=true;
  document.getElementById("spinBtn").disabled=true;
  const index=pickIndex();
  const target=360-(index*SLICE+SLICE/2);          // bring slice centre under the pointer
  rot=rot-(rot%360)+6*360+target;
  document.getElementById("wheel").style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{ showResult(index); spinning=false; document.getElementById("spinBtn").disabled=false; },5300);
}

/* ----- result ----- */
function showResult(i){
  current=PRIZES[i]; claimed=false;
  const isDua=current.amount===0;
  document.getElementById("prizeEmoji").textContent=isDua?"🤲":"🎉";
  document.getElementById("prizeValue").textContent=isDua?"Dua 🤲✨":current.amount+" tk";
  document.getElementById("dua").style.display=isDua?"block":"none";
  document.getElementById("claimForm").style.display=isDua?"none":"block";
  document.getElementById("amount").value=current.amount+" tk";
  document.getElementById("number").value="";
  const st=document.getElementById("status");st.textContent="";st.className="status";
  document.getElementById("claimBtn").disabled=false;
  document.getElementById("modal").classList.add("open");
  if(!isDua) confetti();
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }

/* ----- claim: sends a push notification to Sifat ----- */
async function claim(e){
  e.preventDefault();
  const st=document.getElementById("status"), btn=document.getElementById("claimBtn");
  if(claimed) return;
  const num=document.getElementById("number").value.replace(/\s|-/g,"");
  if(!/^01[3-9]\d{8}$/.test(num)){
    st.textContent="Please enter a valid 11-digit number (01XXXXXXXXX)";st.className="status err";return;
  }
  btn.disabled=true; st.textContent="Sending…"; st.className="status";
  try{
    const res=await fetch("https://ntfy.sh/"+NTFY_TOPIC,{
      method:"POST",
      headers:{"Title":"Eid Salami Claim","Priority":"high","Tags":"moneybag,crescent_moon"},
      body:`Prize: ${current.amount} tk\nNumber: ${num}\nTime: ${new Date().toLocaleString("en-GB")}`
    });
    if(!res.ok) throw new Error("bad response");
    claimed=true;
    st.textContent="✅ Done! Sifat has been notified. Eid Mubarak! 🌙";st.className="status ok";
    confetti();
  }catch(err){
    btn.disabled=false;
    st.textContent="Could not send. Check internet and try again.";st.className="status err";
  }
}

/* ----- tiny confetti ----- */
function confetti(){
  const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ffd166","#ff4fa3","#35e0ff","#2ee59d","#fff"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/2.2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:4+Math.random()*6,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(++f<150) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
</script>
</body>
</html>
